# 아이폰 앱 코드가 빌드되는지만 확인 (서명 없이). 공개 저장소라 macOS 러너도 무료.
# TestFlight에 올리는 실제 빌드는 Codemagic(codemagic.yaml)이 함.
name: iOS build check

on:
  push:
    paths:
      - 'ios-app/**'
      - 'tools/build-ios-web.mjs'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios-app/**'
      - 'tools/build-ios-web.mjs'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Game files
        run: |
          npm ci
          node tools/build-ios-web.mjs

      - name: Use newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios-app
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      # TestFlight 빌드처럼 Release로
      - name: Build for device (Release, unsigned)
        working-directory: ios-app
        run: |
          xcodebuild -project RoadsterRacer.xcodeproj -scheme RoadsterRacer -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
